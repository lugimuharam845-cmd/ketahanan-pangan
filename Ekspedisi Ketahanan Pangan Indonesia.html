<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ekspedisi Ketahanan Pangan Indonesia</title>
<style>
:root{--bg:#0a1f4a;--blue:#143872;--gold:#fbbf24;--cream:#fff4d6;--ink:#1a2a4a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061336}}
:root[data-theme="dark"]{--bg:#061336}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;--cw:min(100vw,calc((100vh - 150px) * 16 / 9))}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#hud,#c{width:var(--cw)}
#hud{display:flex;gap:16px;align-items:center;font-weight:700;font-size:15px;color:var(--gold);position:relative;padding:0 4px 9px;box-sizing:border-box}
#hud span:first-child{margin-right:auto}
#bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:#ffffff26;border-radius:3px}
#bar i{display:block;height:100%;background:var(--gold);border-radius:3px;width:0}
#bar b{position:absolute;top:-2px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:#fff;border:2px solid var(--blue)}
#bar b.d{background:#3fae52}
#c{aspect-ratio:16/9;border-radius:12px;border:2px solid #fbbf2455;display:block;background:#000}
#ctl{display:none;gap:10px;width:var(--cw);justify-content:space-between;padding-top:4px}
#ctl button{flex:1;height:58px;border-radius:14px;border:2px solid var(--gold);background:var(--blue);color:#fff;font:700 18px inherit;touch-action:none;user-select:none}
#ctl #bj{flex:1.6;background:var(--gold);color:#0a1f4a}
@media (pointer:coarse){#ctl{display:flex}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,19,54,.8);padding:12px;overflow:auto;box-sizing:border-box}
.card{background:var(--cream);color:var(--ink);border:2px solid var(--gold);border-radius:20px;max-width:700px;width:100%;overflow:hidden;font-size:16px;line-height:1.45;margin:auto}
.hd{background:var(--blue);color:#fff;padding:12px 18px;font-weight:800;font-size:20px}
.hd small{color:var(--gold);display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.bd{padding:14px 18px 18px}
.info{background:#fff;border-left:4px solid var(--gold);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.o{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border:2px solid #e3c36a;border-radius:12px;background:#fff;color:var(--ink);font:600 15px/1.35 inherit;cursor:pointer}
.o:focus-visible,.btn:focus-visible{outline:3px solid #143872;outline-offset:2px}
.o.ok{background:#c8f0c8;border-color:#2e9b3e}.o.no{background:#ffd3d3;border-color:#d33}.o.sel{background:#ffe9a8;border-color:var(--gold)}
.btn{background:var(--gold);color:#0a1f4a;border:0;border-radius:12px;padding:11px 22px;font:800 16px inherit;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.45;cursor:default}
#fb{margin-top:8px;font-size:14px}
.st{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.st div{flex:1;min-width:110px;background:#fff;border-radius:12px;padding:8px;text-align:center;font-weight:800;color:var(--blue)}
.st small{display:block;font-weight:600;color:#555}
ul.k{margin:6px 0 0;padding-left:20px;font-size:14px}
</style></head><body>
<div id="app">
<div id="hud"><span id="hx">XP 0</span><span id="hl">🌾 0</span><span id="hh">❤️❤️❤️</span><div id="bar"><i></i></div></div>
<canvas id="c"></canvas>
<div id="ctl"><button id="bl">◀</button><button id="br">▶</button><button id="bj">LOMPAT</button></div>
</div>
<div class="ov" id="ov"><div class="card" id="m"></div></div>
<script>
const W=960,H=540,L=6600,GY=432,BX=6200,TOT=620;
const C=document.getElementById("c"),g=C.getContext("2d");C.width=W;C.height=H;
const $=id=>document.getElementById(id);
const ST=[
{x:900,n:"LINGKUNGAN",ic:"🌦️",info:"Iklim menentukan kesesuaian tanaman, curah hujan memengaruhi pola tanam, dan kesuburan tanah serta air menopang produksi pangan.",q:"Faktor lingkungan yang memengaruhi produksi pangan adalah …",o:["Tingkat pendapatan dan harga pangan","Iklim, curah hujan, kesuburan tanah, dan air","Jumlah penduduk dan pola konsumsi","Kebijakan impor dan subsidi"],a:1,ex:"Iklim, curah hujan, kesuburan tanah, dan air adalah unsur lingkungan. Pendapatan dan harga masuk faktor ekonomi, penduduk dan pola konsumsi faktor sosial, impor dan subsidi faktor kebijakan."},
{x:1900,n:"EKONOMI",ic:"💰",info:"Pendapatan memengaruhi kemampuan membeli pangan. Harga yang naik dapat membatasi akses, terutama bagi rumah tangga berpendapatan rendah.",q:"Harga pangan yang tinggi dapat mengurangi ketahanan pangan karena …",o:["Meningkatkan kesuburan tanah","Mengurangi kebutuhan makan","Membatasi kemampuan masyarakat mengakses pangan","Menambah curah hujan"],a:2,ex:"Harga tinggi membatasi akses ekonomi masyarakat terhadap pangan. Harga tidak mengubah kesuburan tanah, kebutuhan makan, atau curah hujan."},
{x:2900,n:"SOSIAL",ic:"👨‍👩‍👧",info:"Pertumbuhan penduduk meningkatkan kebutuhan pangan. Pola konsumsi dan kesejahteraan memengaruhi permintaan serta kemampuan rumah tangga.",q:"Pertumbuhan penduduk yang cepat terutama berdampak pada …",o:["Berkurangnya kebutuhan pangan","Meningkatnya kebutuhan dan permintaan pangan","Hilangnya seluruh lahan pertanian","Turunnya curah hujan"],a:1,ex:"Semakin banyak penduduk, semakin besar kebutuhan dan permintaan pangan suatu wilayah."},
{x:3900,n:"JALUR TERPUTUS",ic:"⛰️",info:"Tantangan 2: jalur utama pengiriman beras ke wilayah pegunungan terputus akibat longsor. Analisis waktu tempuh, biaya angkut, harga, dan akses masyarakat.",q:"Jalan utama distribusi pangan terputus. Dampak yang paling mungkin terjadi adalah …",o:["Biaya dan waktu distribusi meningkat","Produksi pertanian otomatis meningkat","Harga pangan pasti turun","Kebutuhan penduduk menghilang"],a:0,ex:"Jalur alternatif biasanya lebih jauh, sehingga waktu tempuh dan biaya angkut naik. Harga dan akses pangan di wilayah pegunungan ikut terpengaruh."},
{x:4900,n:"KEBIJAKAN",ic:"🏛️",info:"Kebijakan pertanian, impor pangan, dan program ketahanan pangan memengaruhi pasokan serta akses pangan. Solusi perlu terpadu dan sesuai karakter wilayah.",q:"Langkah yang paling tepat untuk menjaga ketahanan pangan wilayah adalah …",o:["Mengalihfungsikan semua lahan pertanian","Mengabaikan kondisi lingkungan","Menggabungkan perlindungan lahan, distribusi baik, dan program pangan","Hanya mengandalkan impor"],a:2,ex:"Ketahanan pangan memerlukan solusi terpadu: lahan produktif dilindungi, distribusi lancar, dan program pangan berjalan."}];
const BOSS={x:BX,n:"FINAL BOSS: WILAYAH X",ic:"🚨"};
const ALL=ST.concat([BOSS]);
const BF=["Lahan pertanian menyusut menjadi kawasan terbangun","Pertumbuhan penduduk meningkatkan kebutuhan pangan","Distribusi pangan belum merata","Tanah terlalu subur","Irigasi dan curah hujan sudah memadai","Harga pangan turun drastis"];
const BS=["Melindungi lahan pertanian produktif dan mengelola air","Memperbaiki akses distribusi dan menekan biaya logistik","Meningkatkan edukasi pangan dan memperhatikan kelompok rentan","Mengalihfungsikan lahan pertanian menjadi perumahan","Hanya mengandalkan impor pangan","Mengabaikan kondisi lingkungan"];
const BT=[{t:"Langkah 1 dari 2 • Tiga faktor utama penyebab krisis",o:BF,ex:"Lahan menyusut, penduduk bertambah, dan distribusi tidak merata saling memperkuat sehingga produksi turun dan harga naik."},{t:"Langkah 2 dari 2 • Tiga solusi yang realistis",o:BS,ex:"Solusi berbasis lingkungan: lindungi lahan dan air, perbaiki distribusi, dan beri perhatian pada kelompok rentan."}];

let mode="menu",px,py,vy,dir,hp,xp,lumb,done,inv,cp,cam=0,T=0,onG=true,pops=[],items=[],rocks=[],cur=0,ans=0,sel=[],bs=0;
const keys={left:0,right:0,jump:0};
for(let x=320,i=0;x<L-400;x+=190,i++){if(ALL.some(s=>Math.abs(s.x-x)<90))continue;items.push({x,h:i%3==2?150:45,e:["🌾","🌽","🍌","🌶️"][i%4],t:0})}
for(let x=640;x<L-500;x+=470){if(ALL.some(s=>Math.abs(s.x-x)<190))continue;rocks.push({x})}
function reset(){px=120;py=0;vy=0;dir=1;hp=3;xp=0;lumb=0;done=0;inv=0;cp=120;items.forEach(i=>i.t=0);pops=[];hud()}
function hud(){$("hx").textContent="XP "+xp;$("hl").textContent="🌾 "+lumb;$("hh").textContent="❤️".repeat(hp)+"🖤".repeat(3-hp);$("bar").firstChild.style.width=(px/L*100)+"%";[...document.querySelectorAll("#bar b")].forEach((b,i)=>b.className=i<done?"d":"")}
ALL.forEach(s=>{const b=document.createElement("b");b.style.left=(s.x/L*100)+"%";$("bar").appendChild(b)});
addEventListener("keydown",e=>{const k=e.key;if(k=="ArrowLeft"||k=="a")keys.left=1;if(k=="ArrowRight"||k=="d")keys.right=1;if(k==" "||k=="ArrowUp"||k=="w"){keys.jump=1;e.preventDefault()}});
addEventListener("keyup",e=>{const k=e.key;if(k=="ArrowLeft"||k=="a")keys.left=0;if(k=="ArrowRight"||k=="d")keys.right=0;if(k==" "||k=="ArrowUp"||k=="w")keys.jump=0});
[["bl","left"],["br","right"],["bj","jump"]].forEach(([id,k])=>{const b=$(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});

/* ---------- dunia ---------- */
function pop(t,c,x){pops.push({x:x??px,y:-py+120,t:60,s:t,c:c||"#fff"})}
function update(f){
 const ax=keys.right-keys.left;if(ax)dir=ax;px=Math.max(40,Math.min(L-40,px+ax*4.3*f));
 if(keys.jump&&onG){vy=-13.5;onG=false}
 vy+=.7*f;py+=vy*f;if(py>=0){py=0;vy=0;onG=true}else onG=false;
 inv-=f;this.mv=ax!=0;
 for(const r of rocks)if(inv<=0&&Math.abs(px-r.x)<34&&py>-28){hp--;inv=90;px-=dir*60;pop("Batu longsor! -1 ❤","#ff8a8a");
  if(hp<=0){px=cp;hp=3;pop("Kelelahan, kembali ke pos terakhir","#ffd36a")}hud()}
 for(const it of items)if(!it.t&&Math.abs(px-it.x)<30&&it.h>-py-12&&it.h<-py+118){it.t=1;lumb++;pop("+1 "+it.e,"#ffe08a",it.x);hud()}
 if(done<5&&px>=ST[done].x)openStation(done);
 else if(done==5&&px>=BX)bossStep(0);
 cam=Math.max(0,Math.min(L-W,px-W*.4));
 $("bar").firstChild.style.width=(px/L*100)+"%";
}
this.mv=false;

/* ---------- kartu & kuis ---------- */
function show(h){$("m").innerHTML=h;$("ov").style.display="flex";$("ov").scrollTop=0}
function hide(){$("ov").style.display="none";mode="play"}
function showStart(){mode="menu";show(`<div class="hd"><small>KURIKULUM MERDEKA • FASE F • GEOGRAFI KELAS XII</small>Ekspedisi Ketahanan Pangan Indonesia</div><div class="bd"><p>Jelajahi Nusantara bersama sang ekspeditor. Lewati lima pos materi, kumpulkan hasil bumi, hindari batu longsor, lalu selamatkan Wilayah X di Final Boss.</p><div class="info"><b>Kontrol:</b> panah kiri/kanan atau A/D untuk berjalan, spasi atau panah atas untuk melompat. Di layar sentuh, pakai tombol di bawah peta.</div><div class="info">Jawaban benar = 100 XP. Jawaban salah membuka pembahasan. Hasil bumi di udara perlu dikejar dengan lompatan.</div><button class="btn" onclick="start()">Mulai ekspedisi ▶</button><p style="font-size:13px;margin:12px 0 0;color:#555">Ahmad Lugi Muharrom • SMA 8 Garut</p></div>`)}
function start(){reset();hide()}
function openStation(i){mode="quiz";cur=i;ans=0;const s=ST[i];keys.left=keys.right=keys.jump=0;
 show(`<div class="hd"><small>POS ${i+1} DARI 5 • ${s.ic}</small>${s.n}</div><div class="bd"><div class="info">${s.info}</div><b>${s.q}</b>${s.o.map((t,k)=>`<button class="o" onclick="pick(${k})">${"ABCD"[k]}. ${t}</button>`).join("")}<div id="fb"></div></div>`)}
function pick(k){if(ans)return;ans=1;const s=ST[cur],b=document.querySelectorAll(".o");
 b[s.a].classList.add("ok");let m;
 if(k==s.a){xp+=100;m="✅ <b>Benar! +100 XP.</b> ";pop("+100 XP","#9be28f")}else{b[k].classList.add("no");m="❌ <b>Belum tepat.</b> Pembahasan: "}
 $("fb").innerHTML=m+s.ex+`<br><button class="btn" onclick="next()">Lanjutkan ekspedisi ▶</button>`;hud()}
function next(){cp=ST[cur].x+40;px=cp;done=cur+1;hp=3;hud();hide()}
function bossStep(n){mode="quiz";bs=n;sel=[];ans=0;const s=BT[n];
 show(`<div class="hd"><small>FINAL BOSS • 🚨</small>Selamatkan Ketahanan Pangan Wilayah X</div><div class="bd"><div class="info">Penduduk bertambah, lahan pertanian menyusut, produksi menurun, harga naik, dan distribusi belum merata.</div><b>${s.t}</b><div style="font-size:13px">Pilih tepat 3 jawaban. Tiap jawaban benar bernilai 20 XP.</div>${s.o.map((t,k)=>`<button class="o" onclick="tog(${k})">${t}</button>`).join("")}<div id="fb"></div><button class="btn" id="chk" disabled onclick="chk()">Periksa jawaban</button></div>`)}
function tog(k){if(ans)return;const i=sel.indexOf(k),b=document.querySelectorAll(".o")[k];if(i>=0){sel.splice(i,1);b.classList.remove("sel")}else if(sel.length<3){sel.push(k);b.classList.add("sel")}$("chk").disabled=sel.length!=3}
function chk(){ans=1;const b=document.querySelectorAll(".o");let c=0;
 [0,1,2].forEach(k=>b[k].classList.add("ok"));sel.forEach(k=>{if(k<3)c++;else b[k].classList.add("no")});
 xp+=c*20;hud();$("chk").remove();
 $("fb").innerHTML=`<b>${c} dari 3 benar (+${c*20} XP).</b> ${BT[bs].ex}<br><button class="btn" onclick="${bs?"endGame()":"bossStep(1)"}">${bs?"Lihat hasil misi ▶":"Lanjut ▶"}</button>`}
function endGame(){mode="end";done=6;hud();const p=xp/TOT,r=p>=.9?"Penjaga Pangan Nusantara":p>=.6?"Penjelajah Geografi":"Calon Ekspeditor";
 show(`<div class="hd"><small>MISI SELESAI!</small>${r}</div><div class="bd"><div class="st"><div>${xp}<small>dari ${TOT} XP</small></div><div>${lumb}<small>hasil bumi terkumpul</small></div></div><p>Ketahanan pangan berawal dari pemahaman terhadap kondisi geografis, kepedulian terhadap lingkungan, dan kerja sama dalam mencari solusi.</p><b>Bahan refleksi</b><ul class="k"><li>Faktor apa yang paling berpengaruh terhadap ketahanan pangan di wilayahmu?</li><li>Mengapa wilayah penghasil pangan belum tentu memiliki akses pangan terbaik?</li><li>Apa satu tindakan untuk menjaga keberlanjutan pangan?</li></ul><button class="btn" onclick="start()">Main lagi ▶</button></div>`)}

/* ---------- gambar ---------- */
function lerp(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function mtn(par,base,amp,c1,c2,seed){const q=g.createLinearGradient(0,base-amp*1.9,0,base);q.addColorStop(0,c1);q.addColorStop(1,c2);g.fillStyle=q;g.beginPath();g.moveTo(0,H);
 for(let x=0;x<=W;x+=6){const wx=x+cam*par+seed;let h=amp*(.45+.22*Math.sin(wx*.003)+.13*Math.sin(wx*.0087+1));const m=((wx%2200)+2200)%2200;h+=amp*1.15*Math.max(0,1-Math.abs(m-1100)/540);g.lineTo(x,base-h)}g.lineTo(W,H);g.fill()}
function bg(){const t=Math.min(1,px/L),a=lerp([255,166,92],[78,150,226],Math.min(1,t*2)),b=lerp([255,214,150],[176,220,246],Math.min(1,t*2));
 const s=g.createLinearGradient(0,0,0,GY-60);s.addColorStop(0,`rgb(${a})`);s.addColorStop(1,`rgb(${b})`);g.fillStyle=s;g.fillRect(0,0,W,H);
 const sx=760-t*260,sy=130-Math.sin(t*3)*40,rg=g.createRadialGradient(sx,sy,6,sx,sy,120);rg.addColorStop(0,"rgba(255,244,200,.95)");rg.addColorStop(.25,"rgba(255,224,150,.5)");rg.addColorStop(1,"rgba(255,224,150,0)");g.fillStyle=rg;g.fillRect(sx-130,sy-130,260,260);
 g.fillStyle="rgba(255,255,255,.65)";for(let i=0;i<6;i++){const x=(((i*310-cam*.05+T*.01)%1300)+1300)%1300-160,y=55+i*26;[[0,0,60,16],[35,-8,44,14],[-34,4,40,11]].forEach(e=>{g.beginPath();g.ellipse(x+e[0],y+e[1],e[2],e[3],0,0,7);g.fill()})}
 mtn(.1,330,110,"#5b7fae","#9fb8d4",0);mtn(.25,372,80,"#2f7a54","#5da56a",900);
 for(let k=Math.floor(cam*.5/700)-1;k<Math.floor(cam*.5/700)+3;k++){const x=k*700+300-cam*.5;g.fillStyle="#c9a26a";g.fillRect(x,350,56,30);g.fillStyle="#9c3f2a";g.beginPath();g.moveTo(x-8,350);g.lineTo(x+28,322);g.lineTo(x+64,350);g.fill();g.fillStyle="#5a3b1e";g.fillRect(x+22,360,12,20)}
 for(let r=0;r<4;r++){const y0=372+r*16;g.fillStyle=r%2?"#5fa339":"#74b94a";g.fillRect(0,y0,W,17);g.strokeStyle="#b6e06a";g.lineWidth=1.4;g.beginPath();const o=(cam*.8)%14;for(let x=-o;x<W;x+=14){const w=Math.sin(T*.003+x*.05+r)*1.8;g.moveTo(x,y0+15);g.lineTo(x+w,y0+5)}g.stroke()}
 for(let k=Math.floor(cam*.9/520)-1;k<Math.floor(cam*.9/520)+3;k++){const x=k*520+240-cam*.9,y=GY-4;g.strokeStyle="#6b4a2a";g.lineWidth=7;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+14,y-60,x+6,y-110);g.stroke();g.strokeStyle="#2f8a3a";g.lineWidth=4;for(let i=0;i<6;i++){const an=i*1.05-.4;g.beginPath();g.moveTo(x+6,y-110);g.quadraticCurveTo(x+6+Math.cos(an)*26,y-130+Math.sin(an)*10,x+6+Math.cos(an)*46,y-104+Math.sin(an)*26);g.stroke()}}
 const p=g.createLinearGradient(0,GY-8,0,H);p.addColorStop(0,"#9a7845");p.addColorStop(1,"#5e4527");g.fillStyle=p;g.fillRect(0,GY-6,W,H-GY+6);g.fillStyle="#4a8a2e";g.fillRect(0,GY-10,W,8);
 g.fillStyle="rgba(60,40,20,.35)";for(let x=-(cam%53);x<W;x+=53){g.beginPath();g.ellipse(x,GY+20+((x+cam)*7%40),5,2.5,0,0,7);g.fill()}}
function rock(r){const x=r.x-cam;if(x<-50||x>W+50)return;const q=g.createLinearGradient(x-20,GY-34,x+20,GY);q.addColorStop(0,"#9a948a");q.addColorStop(1,"#4e4a44");g.fillStyle=q;g.beginPath();g.moveTo(x-24,GY);g.lineTo(x-17,GY-22);g.lineTo(x-2,GY-34);g.lineTo(x+17,GY-25);g.lineTo(x+25,GY);g.fill()}
function stn(s,i){const x=s.x-cam;if(x<-130||x>W+130)return;const dn=i<done;
 if(i==3){for(let k=0;k<8;k++){g.fillStyle=k%2?"#7a5a3a":"#8c8378";g.beginPath();g.ellipse(x+80+k*13,GY-6-(k%3)*7,18,12,0,0,7);g.fill()}g.fillStyle="#d33";g.fillRect(x+70,GY-46,110,5)}
 g.fillStyle="#5a3b1e";g.fillRect(x-3,GY-130,6,130);g.fillStyle=dn?"#3fae52":i==5?"#d94141":"#fbbf24";g.beginPath();g.moveTo(x+3,GY-128);g.lineTo(x+46+Math.sin(T/200)*3,GY-116);g.lineTo(x+3,GY-102);g.fill();
